<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu 55 • 30-Question Storytelling & Sourcing Master</title>
  <style>
    :root {
      --primary: #58cc02;
      --primary-shade: #46a302;
      --wrong: #ff4b4b;
      --wrong-shade: #d33131;
      --wrong-bg: #ffdfe0;
      --correct-bg: #d7ffb8;
      --border-dark: #e5e5e5;
      --text: #3c3c3c;
      --story-tag: #ff9600;
      --story-bg: #fff8eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DIN Next Rounded", "Nunito", -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f7f7f7; color: var(--text); display: flex; justify-content: center; min-height: 100vh; }

    #app-container { width: 100%; max-width: 500px; background: #fff; min-height: 100vh; display: flex; flex-direction: column; position: relative; border-left: 1px solid #eee; border-right: 1px solid #eee; }

    /* Header & Progress Bar */
    .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; gap: 12px; }
    .progress-track { flex-grow: 1; height: 16px; background-color: #e5e5e5; border-radius: 12px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background-color: var(--primary); border-radius: 12px; transition: width 0.35s ease; }
    .hearts { display: flex; align-items: center; gap: 4px; font-weight: 800; color: #ff4b4b; font-size: 1.1rem; }
    .hearts svg { width: 22px; height: 22px; fill: currentColor; }

    /* Mascot Banner */
    .mascot-row { display: flex; align-items: flex-start; gap: 12px; margin: 12px 20px 8px; }
    .mascot-avatar { width: 50px; height: 50px; border-radius: 50%; background: #ff9600; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 4px 0 #cf7500; flex-shrink: 0; }
    .speech-bubble { background: #fff; border: 2px solid #dedede; border-radius: 14px; padding: 10px 14px; font-size: 0.9rem; font-weight: 700; line-height: 1.35; position: relative; flex-grow: 1; }
    .speech-bubble::before { content: ""; position: absolute; left: -8px; top: 14px; border-width: 5px 8px 5px 0; border-style: solid; border-color: transparent #dedede transparent transparent; }

    /* Question View */
    .stage { flex-grow: 1; padding: 10px 20px 140px; display: flex; flex-direction: column; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; width: fit-content; background: var(--story-bg); color: var(--story-tag); border: 1.5px solid #ffe1b3; }
    .prompt-meta { font-size: 0.8rem; font-weight: 800; color: #aaa; text-transform: uppercase; margin-bottom: 4px; }
    .prompt-title { font-size: 1.15rem; font-weight: 800; color: #222; margin-bottom: 14px; line-height: 1.35; }

    /* Story Card */
    .story-card { background: #fafafa; border: 2px dashed #dedede; border-radius: 14px; padding: 12px 14px; font-size: 0.88rem; line-height: 1.45; font-weight: 600; color: #555; margin-bottom: 16px; }

    /* Choice Options */
    .choices-grid { display: flex; flex-direction: column; gap: 10px; }
    .choice-btn {
      background: #fff; border: 2px solid var(--border-dark); border-bottom: 4px solid var(--border-dark);
      border-radius: 14px; padding: 12px 16px; font-size: 0.93rem; font-weight: 700; color: #444;
      cursor: pointer; text-align: left; transition: all 0.1s ease; line-height: 1.3;
    }
    .choice-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
    .choice-btn.selected { border-color: #84d8ff; background: #f0f9ff; border-bottom-color: #5bbde8; color: #1cb0f6; }

    /* Slide-Up Bottom Drawer */
    .drawer {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 18px 20px 24px;
      display: flex; flex-direction: column; gap: 10px; background: #fff; border-top: 2px solid #eee; z-index: 100;
    }
    .drawer.correct { background: var(--correct-bg); border-color: #bbf393; }
    .drawer.wrong { background: var(--wrong-bg); border-color: #ffc1c1; }

    .drawer-status { display: none; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 800; }
    .drawer.correct .drawer-status { display: flex; color: #46a302; }
    .drawer.wrong .drawer-status { display: flex; color: #ea2b2b; }
    .drawer-message { font-size: 0.86rem; font-weight: 600; color: #444; line-height: 1.35; }

    .main-btn {
      background: var(--primary); border: none; border-bottom: 4px solid var(--primary-shade);
      color: #fff; font-size: 1.05rem; font-weight: 800; padding: 14px 20px; border-radius: 14px;
      cursor: pointer; text-align: center; text-transform: uppercase; letter-spacing: 0.6px;
    }
    .main-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .main-btn:disabled { background: #e5e5e5; border-bottom-color: #ccc; color: #afafaf; cursor: not-allowed; transform: none; }
    .drawer.wrong .main-btn { background: var(--wrong); border-bottom-color: var(--wrong-shade); }

    /* Finish Stage */
    .finish-screen { flex-grow: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
    .finish-screen.show { display: flex; }
  </style>
</head>

    function playTone(type) {
      if (!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'wrong') {
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.setValueAtTime(170, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

          "The word 'skin' or 'rind' is NOT printed; servers tell the upcycling story verbally",
          "Never mention ginger to avoid scaring guests",
          "Must ask guests to wear service gloves before cracking"
        ],
        answer: 1,
        exp: "The printed menu lists 'Passionfruit'; servers verbally explain the creative craft of upcycling and slow-cooking the pickled rind."
      },

      // COURSE 10 & 11: GUANAJA CHOCOLATE & PETIT FOURS
      {
        badge: "SERVICE GUIDANCE",
        q: "What exact tasting instruction MUST floor staff deliver for Course 10 (Valrhona 70% Guanaja)?",
        context: "Main dessert temperature and flavor contrast.",
        options: [
          "Eat the cold mandarin sorbet first to freeze the palate before chocolate",
          "Eat the warm chocolate mille-feuille and chilled sorbet together in alternating bites",
          "Melt the chocolate by pouring hot tea over it",
          "Wait 5 minutes for the dish to settle to room temperature"
        ],
        answer: 1,
        exp: "Guests must be guided to enjoy the pleasantly warm chocolate mille-feuille and chilled mandarin sorbet together for temperature contrast."
      },
      {
        badge: "MENU ROTATION LOGIC",
        q: "Why was the peanut praline swapped for Hazelnut Praline in Course 11 (Petit Fours)?",
        context: "Palate rhythm and culinary design logic.",
        options: [
          "Hazelnuts have a longer shelf life in the pastry walk-in",
          "To prevent flavor repetition following the peanut ganache in Course 10",
          "The pastry chef changed Italian suppliers",
          "To make the petit fours 100% nut-free"
        ],
        answer: 1,
        exp: "Swapping to hazelnut praline prevents redundant peanut flavors immediately following the peanut ganache in the main dessert."
      }
    ];

    // --- GAME ENGINE STATE ---
    let curIndex = 0;
    let hearts = 5;
    let selectedIdx = null;
    let isEvaluated = false;

    const progressFill = document.getElementById('progress-fill');
    const heartCount = document.getElementById('heart-count');
    const qCounter = document.getElementById('q-counter');
    const typeBadge = document.getElementById('type-badge');
    const questionTitle = document.getElementById('question-title');
    const storyContext = document.getElementById('story-context');
    const choicesBox = document.getElementById('choices-box');
    const evalDrawer = document.getElementById('eval-drawer');
    const drawerStatus = document.getElementById('drawer-status');
    const statusTitle = document.getElementById('status-title');
    const statusIcon = document.getElementById('status-icon');
    const drawerReason = document.getElementById('drawer-reason');
    const actionBtn = document.getElementById('action-btn');

    function loadQuestion() {
      const item = questions[curIndex];
      isEvaluated = false;
      selectedIdx = null;

      progressFill.style.width = `${(curIndex / questions.length) * 100}%`;
      qCounter.innerText = `Question ${curIndex + 1} of ${questions.length}`;
      typeBadge.innerText = item.badge;
      questionTitle.innerText = item.q;
      storyContext.innerHTML = item.context;

      evalDrawer.className = 'drawer';
      actionBtn.innerText = 'Check';
      actionBtn.disabled = true;

      choicesBox.innerHTML = '';
      item.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        choicesBox.appendChild(btn);
      });
    }

    function selectOption(idx) {
      if (isEvaluated) return;
      selectedIdx = idx;
      document.querySelectorAll('.choice-btn').forEach((b, i) => {
        b.classList.toggle('selected', i === idx);
      });
      actionBtn.disabled = false;
    }

    function handleButtonClick() {
      if (!isEvaluated) {
        evaluate();
      } else {
        curIndex++;
        if (curIndex < questions.length) {
          loadQuestion();
        } else {
          showFinish();
        }
      }
    }

    function evaluate() {
      isEvaluated = true;
      const item = questions[curIndex];
      const isCorrect = selectedIdx === item.answer;

      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

      if (isCorrect) {
        playTone('correct');
        evalDrawer.className = 'drawer correct';
        statusTitle.innerText = 'Excellent Storytelling!';
        statusIcon.innerText = '✔';
        drawerReason.innerText = item.exp;
      } else {
        playTone('wrong');
        hearts = Math.max(0, hearts - 1);
        heartCount.innerText = hearts;
        evalDrawer.className = 'drawer wrong';
        statusTitle.innerText = 'Official Training Note:';
        statusIcon.innerText = '✖';
        drawerReason.innerText = item.options[item.answer] + ' — ' + item.exp;

        if (hearts === 0) {
          setTimeout(() => {
            document.getElementById('quiz-stage').style.display = 'none';
            evalDrawer.style.display = 'none';
            document.getElementById('finish-stage').classList.add('show');
            document.getElementById('finish-icon').innerText = '💔';
            document.getElementById('finish-title').innerText = 'Out of Hearts!';
            document.getElementById('xp-text').innerText = '+0 XP';
            document.getElementById('finish-desc').innerText = 'Review the Menu No. 55 guide and try the 30-question sprint again!';
          }, 800);
          return;
        }
      }

      actionBtn.innerText = (curIndex === questions.length - 1) ? 'Complete Sprint' : 'Continue';
    }

    function showFinish() {
      progressFill.style.width = '100%';
      document.getElementById('quiz-stage').style.display = 'none';
      evalDrawer.style.display = 'none';
      document.getElementById('finish-stage').classList.add('show');
      document.getElementById('finish-icon').innerText = '🏆';
      document.getElementById('finish-title').innerText = 'Mastery Achieved!';
      document.getElementById('xp-text').innerText = '+300 XP';
      document.getElementById('finish-desc').innerText = 'Congratulations! You mastered all 30 menu sourcing, terroir & marketing questions!';
    }

    function resetLesson() {
      curIndex = 0;
      hearts = 5;
      heartCount.innerText = hearts;
      document.getElementById('quiz-stage').style.display = 'flex';
      evalDrawer.style.display = 'flex';
      document.getElementById('finish-stage').classList.remove('show');
      loadQuestion();
    }

    // Launch
    loadQuestion();
  </script>
</body>
</html>
